<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Application Réseau</title>
<style>
  /* Jetons de la direction « Carnet ». Ils seront repris tels quels par l'app. */
  .clair {
    --fond: #f2f2f7;
    --carte: #ffffff;
    --texte: #1c1c1e;
    --secondaire: #636366;
    --trait: rgba(60, 60, 67, 0.16);
    --accent: #b45309;
    --sur-accent: #ffffff;
    --accent-doux: #fdf0dc;
    --barre: rgba(249, 249, 251, 0.94);
    --clavier: #d3d5db;
  }
  .sombre {
    --fond: #000000;
    --carte: #1c1c1e;
    --texte: #f2f2f7;
    --secondaire: #a1a1a6;
    --trait: rgba(235, 235, 245, 0.16);
    --accent: #f5a524;
    --sur-accent: #1c1c1e;
    --accent-doux: #3a2a0c;
    --barre: rgba(22, 22, 24, 0.94);
    --clavier: #2a2a2d;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: #e4e4e9;
    color: #1c1c1e;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .intro { margin: 0 0 24px; color: #48484a; max-width: 60ch; }
  .planche { display: flex; flex-wrap: wrap; gap: 28px 24px; }
  figure { margin: 0; }
  figcaption { font-size: 14px; color: #48484a; margin: 0 0 8px 4px; font-weight: 600; }

  .telephone {
    width: 340px; height: 720px;
    border-radius: 40px; border: 8px solid #111; overflow: hidden;
    background: var(--fond); color: var(--texte);
    display: flex; flex-direction: column; position: relative;
  }
  .etat { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 26px; font-size: 14px; font-weight: 600; }
  .contenu { flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; }

  .grand-titre { font-size: 32px; font-weight: 700; letter-spacing: -0.4px; margin: 10px 4px 14px; }
  .entete-section { font-size: 13px; text-transform: uppercase; letter-spacing: 0.3px;
    color: var(--secondaire); margin: 0 16px 6px; }
  .groupe { background: var(--carte); border-radius: 14px; margin-bottom: 20px; }
  .ligne { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; position: relative; }
  .ligne + .ligne::before { content: ""; position: absolute; top: 0; left: 58px; right: 0; height: 1px; background: var(--trait); }
  .pastille { width: 32px; height: 32px; border-radius: 9px; flex: none; display: grid; place-items: center;
    background: var(--accent-doux); color: var(--accent); }
  .pastille svg { width: 18px; height: 18px; }
  .principal { font-size: 16px; font-weight: 600; }
  .detail { font-size: 14px; color: var(--secondaire); }
  .quand { margin-left: auto; font-size: 14px; color: var(--secondaire); white-space: nowrap; padding-left: 8px; }
  .quand.proche { color: var(--accent); font-weight: 600; }
  .chevron { margin-left: auto; color: var(--secondaire); font-size: 20px; }
  .compteur { margin-left: auto; font-size: 16px; color: var(--secondaire); }

  .pied { flex: none; padding: 0 16px 10px; }
  .bouton-principal {
    width: 100%; min-height: 56px; border: 0; border-radius: 16px;
    background: var(--accent); color: var(--sur-accent);
    font: inherit; font-size: 18px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .bouton-principal svg { width: 20px; height: 20px; }
  .lien-secondaire { text-align: center; color: var(--accent); font-size: 15px; font-weight: 600; padding: 12px 0 4px; }

  .onglets { flex: none; display: flex; background: var(--barre); border-top: 1px solid var(--trait);
    padding: 6px 4px 22px; }
  .onglet { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; color: var(--secondaire); min-height: 44px; justify-content: center; }
  .onglet svg { width: 24px; height: 24px; }
  .onglet.actif { color: var(--accent); font-weight: 600; }

  /* Écran de saisie */
  .navigation { flex: none; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; }
  .navigation .retour, .navigation .termine { color: var(--accent); font-size: 17px; min-width: 88px; }
  .navigation .termine { text-align: right; font-weight: 600; }
  .navigation .titre { font-size: 17px; font-weight: 600; }
  .rattachement { display: flex; align-items: center; gap: 8px; background: var(--carte); border-radius: 12px;
    padding: 0 14px; min-height: 48px; margin: 8px 0 12px; font-size: 15px; }
  .rattachement .changer { margin-left: auto; color: var(--accent); font-weight: 600; }
  .feuille { flex: 1; background: var(--carte); border-radius: 14px; padding: 14px; font-size: 17px; line-height: 1.45; }
  .curseur { display: inline-block; width: 2px; height: 20px; background: var(--accent); vertical-align: -4px; margin-left: 1px; }
  .enregistre { font-size: 13px; color: var(--secondaire); text-align: right; padding: 8px 6px; }
  .clavier { flex: none; height: 262px; background: var(--clavier); display: grid; place-items: center;
    color: var(--secondaire); font-size: 14px; text-align: center; }
</style>
</head>
<body>
<h1>Maquette — direction « Carnet »</h1>
<p class="intro">Deux écrans, en clair et en sombre. Données fictives. Le clavier est celui d'iOS : il est seulement figuré ici.</p>

    <symbol id="i-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-accueil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></symbol>
    <symbol id="i-preparer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></symbol>
    <symbol id="i-personnes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3-5.5 6.5-5.5s5.900 1.900 6.500 5.500M16 5a3.500 3.500 0 0 1 0 6.500M18 14.800c2 .700 3.200 2.400 3.600 5.200"/></symbol>

  </defs>
</svg>

<div class="planche">
<figure>
<figcaption>Accueil — clair</figcaption>
<div class="telephone clair">
  <div class="etat"><span>9:41</span><span>5G</span></div>
  <div class="contenu">
    <div class="grand-titre">Accueil</div>
    <div class="entete-section">Cette semaine</div>
    <div class="groupe">
      <div class="ligne">
        <span class="pastille"><svg><use href="#i-gateau"/></svg></span>
        <div><div class="principal">Thomas Reynaud</div><div class="detail">Anniversaire</div></div>
        <span class="quand proche">samedi</span>
      </div>
      <div class="ligne">
        <span class="pastille"><svg><use href="#i-suivi"/></svg></span>
        <div><div class="principal">Camille Vasseur</div><div class="detail">Lui envoyer le nom de mon ostéo</div></div>
        <span class="quand">30 nov.</span>
      </div>
    </div>
    <div class="entete-section">En attente</div>
    <div class="groupe">
      <div class="ligne">
        <span class="pastille"><svg><use href="#i-note"/></svg></span>
        <div><div class="principal">Notes à traiter</div><div class="detail">Dernière sauvegarde il y a 2 jours</div></div>
        <span class="compteur">3</span><span class="chevron" style="margin-left:6px">›</span>
      </div>
    </div>
  </div>
  <div class="pied">
    <button class="bouton-principal" type="button"><svg><use href="#i-plus"/></svg>Nouvelle note</button>
    <div class="lien-secondaire">Nouvel événement</div>
  </div>
  <div class="onglets">
    <div class="onglet actif"><svg><use href="#i-accueil"/></svg>Accueil</div>
    <div class="onglet"><svg><use href="#i-preparer"/></svg>Préparer</div>
    <div class="onglet"><svg><use href="#i-personnes"/></svg>Personnes</div>
    <div class="onglet"><svg><use href="#i-gateau"/></svg>Anniv.</div>
    <div class="onglet"><svg><use href="#i-sauvegarde"/></svg>Sauvegarde</div>
  </div>
</div>
</figure>
<figure>
<figcaption>Saisie — clair</figcaption>
<div class="telephone clair">
  <div class="etat"><span>9:41</span><span>5G</span></div>
  <div class="navigation">
    <span class="retour">‹ Accueil</span><span class="titre">Nouvelle note</span><span class="termine">Terminé</span>
  </div>
  <div class="contenu">
    <div class="rattachement">
      <span class="detail">Événement</span><span>Afterwork de novembre</span><span class="changer">Changer</span>
    </div>
    <div class="feuille">Nouveau : Thomas Reynaud, architecte, joue depuis deux ans, cherche un partenaire pour le tournoi de janvier<span class="curseur"></span></div>
    <div class="enregistre">Enregistré automatiquement</div>
  </div>
  <div class="clavier">Clavier iOS<br>(dictée par la touche micro)</div>
</div>
</figure>
